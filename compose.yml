services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: ghcr.io/jordonrh/ai-governance-compliance-tracker:latest
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5173
      AITRACE_BIND_HOST: 0.0.0.0
      AITRACE_ALLOWED_HOSTNAMES: ${AITRACE_ALLOWED_HOSTNAMES}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AITRACE_BOOTSTRAP_LOGIN: ${AITRACE_BOOTSTRAP_LOGIN:-}
      AITRACE_BOOTSTRAP_PASSWORD: ${AITRACE_BOOTSTRAP_PASSWORD:-}
      AITRACE_BOOTSTRAP_DISPLAY_NAME: ${AITRACE_BOOTSTRAP_DISPLAY_NAME:-}
      AITRACE_BOOTSTRAP_ORGANIZATION_ID: ${AITRACE_BOOTSTRAP_ORGANIZATION_ID:-}
      AITRACE_BOOTSTRAP_ORGANIZATION_NAME: ${AITRACE_BOOTSTRAP_ORGANIZATION_NAME:-}
    networks:
      - app_internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy

volumes:
  postgres_data:

networks:
  app_internal:
    internal: true
  proxy:
