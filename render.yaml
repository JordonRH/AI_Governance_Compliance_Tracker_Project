services:
  - type: web
    name: aitrace
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AITRACE_BIND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
